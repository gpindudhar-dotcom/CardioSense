; CardioSense ESP32-S3 firmware (PlatformIO)
; Educational prototype — not a medical device.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.f_flash = 80000000L
lib_deps =
  links2004/WebSockets@^2.4.1
  bblanchon/ArduinoJson@^7.2.1
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  ; Override Wi-Fi / ADC locally (do not commit secrets):
  ; -DWIFI_SSID=\"YourSSID\"
  ; -DWIFI_PASSWORD=\"YourPassword\"
  ; -DADC_PIN=4
  ; -DSAMPLE_RATE=4000
  ; -DBLOCK_SIZE=128
build_src_filter = +<*>

[env:esp32-s3-generic]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  links2004/WebSockets@^2.4.1
  bblanchon/ArduinoJson@^7.2.1
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DADC_PIN=4
  -DSAMPLE_RATE=4000
  -DBLOCK_SIZE=128
